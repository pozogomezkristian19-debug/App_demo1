name: Build Melli-Qui APK

on:
  push:
    paths:
      - 'quimica-pura-flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      - name: Restore binary assets from base64
        run: |
          cd quimica-pura-flutter
          # Generic: decode EVERY *.b64 file under assets/ (logo, twins,
          # whatsapp, brenda, britany, sounds, and any future binary asset).
          # The GitHub connector uploads binaries as base64 text, so each
          # binary travels as <name>.b64 and is rebuilt here before building.
          find assets -name "*.b64" | while read -r b; do
            base64 -d "$b" > "${b%.b64}"
            echo "Restaurado: ${b%.b64}"
          done
          # The Gradle wrapper jar and the launcher icons arrive as base64
          # text too (no .b64 extension); restore them if needed. If a file
          # is already a real binary, leave it as is.
          for f in android/gradle/wrapper/gradle-wrapper.jar android/app/src/main/res/mipmap-*/ic_launcher.png; do
            if file "$f" | grep -qE "Zip archive|PNG image"; then
              echo "OK binario: $f"
            else
              base64 -d "$f" > /tmp/restore.bin && mv /tmp/restore.bin "$f"
              echo "Restaurado: $f"
            fi
          done

      - name: Restore release keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > quimica-pura-flutter/android/app/quemia-release.keystore
            {
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storeFile=quemia-release.keystore"
            } > quimica-pura-flutter/android/key.properties
            echo "Keystore release restaurado (firma permanente Quemia)"
          else
            echo "Sin secreto ANDROID_KEYSTORE_BASE64: se firmara con claves debug"
          fi

      - name: Install dependencies
        run: flutter pub get
        working-directory: quimica-pura-flutter

      - name: Build release APK
        run: flutter build apk --release
        working-directory: quimica-pura-flutter

      - name: Prepare APK asset
        run: cp quimica-pura-flutter/build/app/outputs/flutter-apk/app-release.apk quimica-pura-flutter/melli-qui-release.apk

      - name: Publish APK as GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: melli-qui-v2
          name: Melli-Qui v2
          files: quimica-pura-flutter/melli-qui-release.apk
          fail_on_unmatched_files: true

      - name: Fallback - commit APK to docs/ for GitHub Pages
        if: steps.release.outcome == 'failure'
        run: |
          cp quimica-pura-flutter/melli-qui-release.apk docs/melli-qui-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/melli-qui-release.apk
          git commit -m "Melli-Qui: APK v2 para descarga por la pagina"
          git push
