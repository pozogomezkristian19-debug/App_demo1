name: quimica_pura
description: "Melli-Qui — Química Pura para universidad: solucionadores paso a paso, tabla periódica interactiva, temas de estudio, tests con explicación y tips de examen."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

# La app funciona sin internet: el nombre, el género, el tema claro/oscuro
# y el progreso (mejor puntuación, niveles, aciertos por tema y errores
# para repasar) se guardan en el teléfono con SharedPreferences.
dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.10
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/app_icon.png
    - assets/ring_logo.png
    - assets/twins.png
    - assets/brenda.png
    - assets/britany.png
    - assets/kristian.png
    - assets/whatsapp.png
    - assets/laurel_oro.png
    - assets/laurel_plata.png
    - assets/laurel_bronce.png
    - assets/avatar_dorado.png
    - assets/avatar_violeta.png
    - assets/avatar_teal.png
    - assets/avatar_default.png
    - assets/google_g.png
    - assets/sounds/correct.wav
    - assets/sounds/wrong.wav
    - assets/sounds/levelup.wav
    - assets/sounds/streak.wav
    - assets/sounds/click.wav

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
