name: quimica_pura
description: "Melli-Qui — Química Pura para universidad: solucionadores paso a paso, tabla periódica interactiva, temas de estudio, tests con explicación y tips de examen."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

# La app funciona sin internet: el nombre, el género, el tema claro/oscuro
# y el progreso se guardan en el teléfono con SharedPreferences.
# El progreso (temas dominados y mejor puntuación) se guarda en memoria
# durante la sesión.
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
